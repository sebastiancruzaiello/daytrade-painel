# Monta o instalador do Windows e publica como lançamento do GitHub quando a versão do package.json muda.
# O programa instalado procura esses lançamentos e se atualiza sozinho.
name: Publicar versão

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/publicar.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Versão já publicada?
        id: versao
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "v=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx latest.yml; then
            echo "existe=sim" >> "$GITHUB_OUTPUT"
          else
            # lançamento pela metade (sem latest.yml) não serve para atualizar: apaga e refaz
            gh release delete "v$v" --yes --cleanup-tag 2>/dev/null || true
            echo "existe=nao" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.versao.outputs.existe == 'nao'
        run: npm ci
      - if: steps.versao.outputs.existe == 'nao'
        run: npm test
      - if: steps.versao.outputs.existe == 'nao'
        name: Montar o instalador
        run: npm run dist:win
      # Publica num passo só (instalador, blockmap e latest.yml juntos), para o programa nunca ver um lançamento pela metade.
      - if: steps.versao.outputs.existe == 'nao'
        name: Publicar o lançamento
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.versao.outputs.v }}
          gh release create "v$v" --target "$GITHUB_SHA" --title "$v" --notes "DAYTRADE Painel $v" \
            "release/DAYTRADE-Painel-Instalador-$v.exe" "release/DAYTRADE-Painel-Instalador-$v.exe.blockmap" release/latest.yml
